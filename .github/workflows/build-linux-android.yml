name: build-linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-linux-android.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 -> glibc 2.35,proot 里兼容面更大
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libwayland-dev pkg-config
      - name: Build
        run: cargo build --release --no-default-features --features pcap,stream
      - name: Package with bundled libpcap
        run: |
          set -eux
          mkdir -p dist/lib
          cp target/release/reliquary-archiver dist/
          # 把动态 libpcap 一起打包,proot 里不需要 apt install 任何东西
          PCAP_SO="$(ldd target/release/reliquary-archiver | awk '/libpcap/{print $3}')"
          cp -L "$PCAP_SO" dist/lib/
          cat > dist/reliquary-archiver-run <<'SH'
          #!/bin/sh
          DIR=$(cd "$(dirname "$0")" && pwd)
          LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$DIR/reliquary-archiver" "$@"
          SH
          sed -i 's/^          //' dist/reliquary-archiver-run
          chmod +x dist/reliquary-archiver-run
          cp LICENSE dist/ || true
          ls -lR dist
      - name: Smoke test
        run: |
          set -eux
          ./dist/reliquary-archiver-run --help | head -20
      - name: Tarball
        run: |
          set -eux
          tar -C dist -czf reliquary-archiver-${{ matrix.arch }}-linux-gnu.tar.gz .
          ls -l reliquary-archiver-${{ matrix.arch }}-linux-gnu.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: reliquary-archiver-${{ matrix.arch }}-linux-gnu
          path: reliquary-archiver-${{ matrix.arch }}-linux-gnu.tar.gz
          if-no-files-found: error
